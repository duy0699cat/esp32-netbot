name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  FQBN: esp32:esp32:esp32:PartitionScheme=no_fs

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No secrets or keys are tracked
        run: |
          if git ls-files | grep -Ei '(^|/)(secrets\.h|.*\.pem|.*\.key|.*\.p12|\.env.*)$'; then
            echo "::error::A secret/key file is tracked by git"; exit 1
          fi

      - name: version.h is well-formed
        run: grep -Eq '^#define FW_VERSION "[0-9]+\.[0-9]+\.[0-9]+"$' firmware/esp32-netbot/version.h

      - uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db # v2.1.0
        with:
          version: 1.6.0

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install ArduinoJson@7.4.3

      - name: Compile firmware
        run: arduino-cli compile --fqbn "$FQBN" --warnings default firmware/esp32-netbot

      - name: Python tools parse
        run: python3 -m py_compile tools/*.py
