name: Release

# Builds the firmware for a version tag and creates a DRAFT release with build-provenance attestations.
# The update-signing key is deliberately NOT available here: a maintainer signs the draft locally with
# tools/sign_release.py and publishes it. See docs/RELEASING.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

env:
  ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  FQBN: esp32:esp32:esp32:PartitionScheme=no_fs

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match version.h
        run: |
          v=$(sed -n 's/^#define FW_VERSION "\([0-9.]*\)"$/\1/p' firmware/esp32-netbot/version.h)
          if [ -z "$v" ] || [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version.h (v$v)"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db # v2.1.0
        with:
          version: 1.6.0

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install ArduinoJson@7.4.3

      - name: Build
        run: arduino-cli compile --fqbn "$FQBN" --export-binaries --output-dir out firmware/esp32-netbot

      - name: Package artifacts and manifest
        run: |
          mkdir dist
          cp out/esp32-netbot.ino.bin dist/firmware.bin
          cp out/esp32-netbot.ino.merged.bin dist/esp32-netbot-factory.bin
          size=$(stat -c %s dist/firmware.bin)
          sha=$(sha256sum dist/firmware.bin | cut -d' ' -f1)
          printf '{"name":"esp32-netbot","version":"%s","size":%s,"sha256":"%s"}\n' "$VERSION" "$size" "$sha" > dist/manifest.json
          (cd dist && sha256sum firmware.bin esp32-netbot-factory.bin manifest.json > SHA256SUMS)
          cat dist/manifest.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Draft: awaiting offline signing (manifest.json.sig). See docs/RELEASING.md."
